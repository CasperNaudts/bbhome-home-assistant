name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Hassfest layout
        run: |
          mkdir -p custom_components/bbhome
          rsync -a --exclude=.git --exclude=.github --exclude=custom_components ./ custom_components/bbhome/
          rm manifest.json

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install --upgrade ruff

      - name: Run Ruff
        run: ruff check --line-length 120 --select E4,E7,E9,F,I .

      - name: Compile Python files
        run: python -m compileall .
